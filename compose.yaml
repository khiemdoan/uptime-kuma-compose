services:
  uptime:
    image: docker.io/louislam/uptime-kuma:2.5.9-slim-rootless@sha256:053a48927ee714b1da78c6810041a44a266bd8c06dc30ead5b3f459d0f219fb0
    container_name: uptime-kuma
    restart: always
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    ports:
      - 127.0.0.1:3001:3001/tcp
    volumes:
      - .data:/app/data:z
    environment:
      - TZ=Asia/Ho_Chi_Minh
    pre_start:
      - image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
        cap_add:
          - CHOWN
        command: chown 1000:1000 /app/data
    healthcheck:
      test: curl -f http://localhost:3001
      interval: 60s
      timeout: 1s
      retries: 3
      start_period: 30s
